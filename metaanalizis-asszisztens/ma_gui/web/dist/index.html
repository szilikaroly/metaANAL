.fp-study.is-estimated .fp-square { fill: var(--est-mark); }

.pl-svg .fp-flag.is-estimated { fill: var(--est-mark); font-size: 11px; }
.pl-svg .fp-flag.is-outlier { fill: var(--plot-rob-high); font-size: 11px; }
.pl-svg .fp-flag.is-influential { fill: var(--plot-rob-high); font-size: 10px; }
.pl-svg .fp-cell, .pl-svg .fp-effect, .pl-svg .fp-weight { font-variant-numeric: tabular-nums; }

.pl-svg .fp-note { fill: var(--muted); font-size: 11.5px; }
.pl-svg .fp-sgtest { fill: var(--ink); font-weight: 600; }
.pl-svg .fp-side { fill: var(--muted); font-size: 11.5px; font-style: italic; }
.fn-band.is-outside { fill: var(--plot-contour-1); }

.fn-point, .doi-point { fill: var(--plot-marker); stroke: var(--surface); stroke-width: 1; }
.fn-filled { fill: var(--surface); stroke: var(--plot-pi); stroke-width: 1.6; stroke-dasharray: 2 1.5; }

.inf-bar { stroke: var(--plot-marker); stroke-width: 2; opacity: .55; }
.inf-mark { fill: var(--plot-marker); }
.inf-mark.is-flag { fill: var(--plot-rob-high); stroke: var(--plot-ci); stroke-width: .6; }

@media print {

}
